log:
  level: DEBUG

api:
  insecure: true

providers:
  docker: {}
  file:
    filename: /opt/traefik/etc/tls.yaml
    watch: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: https
          scheme: https
  https:
    address: ":443"
    http:
      tls:
        options: default

metrics:
  otlp:
    grpc:
      endpoint: collector:4317
      insecure: true

tracing:
  otlp:
    grpc:
      endpoint: collector:4317
      insecure: true
 
accesslog:
  otlp:
    grpc:
      endpoint: collector:4317
      insecure: true

experimental:
  otlpLogs: true
